gradle.projectsEvaluated {
    def target = gradle.rootProject.project(':1.21.1')
    target.tasks.register('writeImportVerificationClasspath') {
        doLast {
            def source = target.extensions.getByType(org.gradle.api.tasks.SourceSetContainer).getByName('main')
            def output = gradle.rootProject.file('build/import-verification-classpath.txt')
            output.parentFile.mkdirs()
            output.text = (source.compileClasspath.files + source.runtimeClasspath.files + source.output.files)
                    .collect { it.absolutePath }.unique().join(System.lineSeparator())
        }
    }
}
