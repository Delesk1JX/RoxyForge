plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.24'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', ''
            property 'forge.logging.console.level', 'debug'

            mods {
                roxy {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

configurations.all {
    // Forge 1.20.1 ships securejarhandler 1.0.3; ForgeGradle would otherwise resolve the newer
    // NeoForge-era artifact, so the locator would compile against an API the game does not have.
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'cpw.mods' && details.requested.name == 'securejarhandler') {
            details.useVersion '1.0.3'
            details.because 'matches the Forge 1.20.1 runtime'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    compileOnly 'cpw.mods:securejarhandler:1.0.3'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            forge_version       : forge_version,
            forge_version_range : forge_version_range,
            loader_version_range: loader_version_range,
            mod_id              : mod_id,
            mod_name            : mod_name,
            mod_version         : mod_version,
            mod_license         : mod_license,
            mod_description     : mod_description,
            version             : project.version,
            mod_authors         : mod_authors,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

// M3: offline remap of a Voxy jar with the generated mapping, plus the report the port needs.
tasks.register('remapVoxy', JavaExec) {
    group = 'roxyforge'
    description = 'Remap a Voxy jar to Forge 1.20.1 names and write the coverage report'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'net.rasanovum.roxy.tools.RemapVoxyTool'
    args project.mapping_file,
            project.voxy_jar,
            layout.buildDirectory.file('remapped/voxy.jar').get().asFile.path,
            layout.buildDirectory.file('remapped/remap-report.txt').get().asFile.path
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
        ])
    }
}
