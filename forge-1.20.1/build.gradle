plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.24'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', ''
            property 'forge.logging.console.level', 'debug'

            mods {
                roxy {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

configurations.all {
    // Forge 1.20.1 ships securejarhandler 1.0.3; ForgeGradle would otherwise resolve the newer
    // NeoForge-era artifact, so the locator would compile against an API the game does not have.
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'cpw.mods' && details.requested.name == 'securejarhandler') {
            details.useVersion '1.0.3'
            details.because 'matches the Forge 1.20.1 runtime'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    compileOnly 'cpw.mods:securejarhandler:1.0.3'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            forge_version       : forge_version,
            forge_version_range : forge_version_range,
            loader_version_range: loader_version_range,
            mod_id              : mod_id,
            mod_name            : mod_name,
            mod_version         : mod_version,
            mod_license         : mod_license,
            mod_description     : mod_description,
            version             : project.version,
            mod_authors         : mod_authors,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

// M3: offline remap of a Voxy jar with the generated mapping, plus the report the port needs.
tasks.register('remapVoxy', JavaExec) {
    group = 'roxyforge'
    description = 'Remap a Voxy jar to Forge 1.20.1 names and write the coverage report'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'net.rasanovum.roxy.tools.RemapVoxyTool'
    args project.mapping_file,
            project.voxy_jar,
            layout.buildDirectory.file('remapped/voxy.jar').get().asFile.path,
            layout.buildDirectory.file('remapped/remap-report.txt').get().asFile.path
}

// The Minecraft 1.20.1 class index (client SRG jar plus the deobfuscated server jar), written by
// build_mappings.py --emit-index. Regenerate with `gradlew mcIndex`.
tasks.register('mcIndex', Exec) {
    group = 'roxyforge'
    description = 'Rebuild the Minecraft 1.20.1 class index used by linkCheckVoxy'
    commandLine 'python', 'tools/roxy-mappings/build_mappings.py',
            '--mc-jar', project.mc_srg_jar,
            '--server-jar', project.mc_server_jar,
            '--emit-index', layout.buildDirectory.file('mc-index-1.20.1.txt').get().asFile.path
}

// The mapping and the bridge list travel with our jar: the locator remaps Voxy at load time, the same way
// upstream Roxy does, so the user keeps dropping in an untouched Voxy jar.
def mappingResource = layout.buildDirectory.file('roxyforge/mapping.txt')
def bridgeResource = layout.buildDirectory.file('roxyforge/bridges.txt')

tasks.register('bundleRoxyForgeData', Copy) {
    from(project.mapping_file) { rename { 'mapping.txt' } }
    from(project.file('tools/roxy-mappings/roxy-mappings/bridges.txt')) { rename { 'bridges.txt' } }
    into layout.buildDirectory.dir('generated-resources')
}


tasks.named('processResources') {
    dependsOn 'bundleRoxyForgeData'
    from(layout.buildDirectory.dir('generated-resources')) {
        into 'roxyforge'
    }
}

// M4c: static link check of the remapped jar against the jars the game really loads.
tasks.register('linkCheckVoxy', JavaExec) {
    group = 'roxyforge'
    description = 'Report every Minecraft class/method/field the remapped Voxy jar cannot link'
    dependsOn 'remapVoxy', 'jar'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'net.rasanovum.roxy.tools.VoxyLinkCheckTool'
    args layout.buildDirectory.file('remapped/voxy.jar').get().asFile.path,
            project.mc_srg_jar,
            layout.buildDirectory.file('mc-index-1.20.1.txt').get().asFile.path,
            project.embeddium_jar,
            // Our own jar carries the shims, so the checker sees what the game will see.
            tasks.named('jar').get().archiveFile.get().asFile.path,
            layout.buildDirectory.file('remapped/link-report.txt').get().asFile.path
}

// The shims are compiled into our jar and injected into the runtime copy of the Voxy jar by the
// locator, so the index of them has to travel with the build.
def shimIndex = layout.buildDirectory.file('roxyforge/shims.txt')

tasks.register('writeShimIndex') {
    dependsOn 'classes'
    def classesDirs = sourceSets.main.output.classesDirs
    def target = shimIndex
    inputs.files(classesDirs)
    outputs.file(target)
    doLast {
        // Paths are relative to the classes root: the file travels inside our jar and is read back as a
        // classpath resource at runtime, where absolute build paths mean nothing.
        def shims = []
        classesDirs.each { File root ->
            fileTree(dir: root, include: 'net/minecraft/class_*.class').each { File file ->
                shims << root.toPath().relativize(file.toPath()).toString().replace('\\', '/')
            }
        }
        shims.sort()
        def file = target.get().asFile
        file.parentFile.mkdirs()
        file.text = shims.join('\n') + '\n'
        logger.lifecycle("shim index: ${shims.size()} class(es) -> ${file}")
    }
}

tasks.named('jar') {
    dependsOn 'writeShimIndex'
    from(shimIndex) {
        into 'roxyforge'
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
        ])
    }
}
